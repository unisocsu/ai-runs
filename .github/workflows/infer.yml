name: Run local AI

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Question or coding task (saved publicly in this repository)"
        required: true
        type: string
      max_tokens:
        description: "Maximum answer length"
        required: true
        type: choice
        options:
          - "256"
          - "512"
          - "1024"
        default: "512"
      reset_history:
        description: "Start a new conversation (old commits are not deleted)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-runs-inference
  cancel-in-progress: false

jobs:
  inference:
    name: Run Qwen3 with cached model and llama.cpp build
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODEL_PATH: .cache/models/Qwen3-8B-Q4_K_M.gguf
      PROMPT: ${{ inputs.prompt }}
      MAX_TOKENS: ${{ inputs.max_tokens }}
      RESET_HISTORY: ${{ inputs.reset_history }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git curl ca-certificates python3

      - name: Restore cached model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/models
          key: qwen3-8b-q4km-v1-linux

      - name: Report model cache result
        run: |
          if [ "${{ steps.model-cache.outputs.cache-hit }}" = "true" ]; then
            echo "MODEL CACHE HIT: restored model; download skipped."
          else
            echo "MODEL CACHE MISS: model must be downloaded this run."
          fi

      - name: Download model if cache is missing
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache/models
          curl --location --fail --show-error --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            "https://huggingface.co/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf?download=true" \
            --output "$MODEL_PATH"
          test -s "$MODEL_PATH"
          echo "Downloaded model size:"
          du -h "$MODEL_PATH"

      - name: Save model to Actions cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/models
          key: qwen3-8b-q4km-v1-linux

      - name: Verify model file
        run: |
          set -euo pipefail
          test -s "$MODEL_PATH"
          ls -lh "$MODEL_PATH"
          df -h .

      # Cache both the llama.cpp source tree and compiled build directory.
      # The stable key intentionally reuses this exact build until manually bumped.
      - name: Restore cached llama.cpp source and compilation
        id: cpp-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/llama.cpp
          key: llama-cpp-server-ubuntu-x64-v1

      - name: Report C++ build cache result
        run: |
          if [ "${{ steps.cpp-cache.outputs.cache-hit }}" = "true" ] && [ -x .cache/llama.cpp/build/bin/llama-server ]; then
            echo "LLAMA.CPP BUILD CACHE HIT: source and compiled llama-server restored; compilation skipped."
          else
            echo "LLAMA.CPP BUILD CACHE MISS/INVALID: source/build must be prepared."
          fi

      - name: Clone llama.cpp if cache is missing
        if: steps.cpp-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git .cache/llama.cpp

      - name: Compile llama-server if not cached
        run: |
          set -euo pipefail
          if [ ! -x .cache/llama.cpp/build/bin/llama-server ]; then
            cmake -S .cache/llama.cpp -B .cache/llama.cpp/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=ON \
              -DLLAMA_CURL=OFF
            cmake --build .cache/llama.cpp/build --config Release --target llama-server -j 4
          else
            echo "Using cached llama-server binary; no C++ compilation needed."
          fi
          test -x .cache/llama.cpp/build/bin/llama-server
          ls -lh .cache/llama.cpp/build/bin/llama-server

      - name: Save llama.cpp source and build to Actions cache
        if: steps.cpp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/llama.cpp
          key: llama-cpp-server-ubuntu-x64-v1

      - name: Start local model server
        run: |
          set -euo pipefail
          nohup .cache/llama.cpp/build/bin/llama-server \
            --model "$MODEL_PATH" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 8192 \
            --threads 4 \
            --no-webui \
            > .cache/llama-server.log 2>&1 &
          echo $! > .cache/llama-server.pid

      - name: Generate answer
        run: python3 scripts/infer.py

      - name: Upload answer artifact
        if: always() && hashFiles('latest-result.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-answer
          path: latest-result.md
          if-no-files-found: warn
          retention-days: 30

      - name: Show server log if generation failed
        if: failure()
        run: |
          if [ -f .cache/llama-server.log ]; then
            tail -n 200 .cache/llama-server.log
          fi

      - name: Commit saved conversation and latest answer
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/conversation.json latest-result.md latest-answer.txt
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Save AI conversation result"
            git push
          fi
