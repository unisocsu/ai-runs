name: Task Dispatch — Run local AI

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Question or coding task (saved publicly in this repository)"
        required: true
        type: string
      max_tokens:
        description: "Maximum answer length"
        required: true
        type: choice
        options:
          - "256"
          - "512"
          - "1024"
        default: "512"
      reset_history:
        description: "Start a new conversation (old commits are not deleted)"
        required: true
        type: boolean
        default: false
      session_id:
        description: "Website chat session ID (leave blank for a one-off run)"
        required: false
        type: string
        default: ""
      message_id:
        description: "Website message ID (leave blank for a one-off run)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ai-runs-inference
  cancel-in-progress: false

jobs:
  inference:
    name: Run Qwen3-4B-Instruct-2507 with four CPU threads
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODEL_PATH: .cache/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      PROMPT: ${{ inputs.prompt }}
      MAX_TOKENS: ${{ inputs.max_tokens }}
      RESET_HISTORY: ${{ inputs.reset_history }}
      SESSION_ID: ${{ inputs.session_id }}
      MESSAGE_ID: ${{ inputs.message_id }}
      GH_API_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Register website session before model setup
        env:
          SESSION_ID: ${{ inputs.session_id }}
        run: python3 scripts/session_state.py start

      - name: Set up system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git curl ca-certificates python3

      - name: Download model (never cached)
        run: |
          set -euo pipefail
          mkdir -p .cache/models
          rm -f "$MODEL_PATH"
          echo "Downloading Qwen3-4B-Instruct-2507 (Q4_K_M) fresh for this run; model cache is disabled."
          curl --location --fail --show-error --retry 5 --retry-all-errors \
            --connect-timeout 30 \
            "https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf?download=true" \
            --output "$MODEL_PATH"
          test -s "$MODEL_PATH"
          echo "Downloaded model size:"
          du -h "$MODEL_PATH"

      - name: Verify model file
        run: |
          set -euo pipefail
          test -s "$MODEL_PATH"
          ls -lh "$MODEL_PATH"
          df -h .

      # Only the compiled CMake build is cached. The model is downloaded fresh every run.
      - name: Restore cached llama.cpp compilation
        id: cpp-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/llama.cpp-build
          key: llama-cpp-build-only-ubuntu-x64-v2

      - name: Report C++ build cache result
        run: |
          if [ "${{ steps.cpp-cache.outputs.cache-hit }}" = "true" ] && [ -x .cache/llama.cpp-build/bin/llama-server ]; then
            echo "LLAMA.CPP BUILD CACHE HIT: compiled llama-server restored; compilation skipped."
          else
            echo "LLAMA.CPP BUILD CACHE MISS/INVALID: build must be prepared."
          fi

      - name: Get llama.cpp source
        run: |
          set -euo pipefail
          mkdir -p .cache
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git .cache/llama.cpp-src

      - name: Compile llama-server if not cached
        run: |
          set -euo pipefail
          if [ ! -x .cache/llama.cpp-build/bin/llama-server ]; then
            cmake -S .cache/llama.cpp-src -B .cache/llama.cpp-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_NATIVE=ON \
              -DLLAMA_CURL=OFF
            cmake --build .cache/llama.cpp-build --config Release --target llama-server -j 4
          else
            echo "Using cached llama-server binary; no C++ compilation needed."
          fi
          test -x .cache/llama.cpp-build/bin/llama-server
          ls -lh .cache/llama.cpp-build/bin/llama-server

      - name: Save compiled llama.cpp build to Actions cache
        if: steps.cpp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/llama.cpp-build
          key: llama-cpp-build-only-ubuntu-x64-v2

      - name: Verify four CPU workers are available
        run: |
          set -euo pipefail
          echo "Logical CPUs available to this workflow: $(nproc)"
          lscpu
          if [ "$(nproc)" -lt 4 ]; then
            echo "::error::This runner exposes fewer than four CPUs; refusing to run with reduced CPU capacity."
            exit 1
          fi

      - name: Start local model server
        run: |
          set -euo pipefail
          nohup .cache/llama.cpp-build/bin/llama-server \
            --model "$MODEL_PATH" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 8192 \
            --threads 4 \
            --threads-batch 4 \
            --no-webui \
            > .cache/llama-server.log 2>&1 &
          echo $! > .cache/llama-server.pid

      - name: Generate answer and keep session alive
        run: python3 scripts/session_worker.py

      - name: Mark website session as finished
        if: always()
        env:
          SESSION_ID: ${{ inputs.session_id }}
        run: python3 scripts/session_state.py finish

      - name: Upload agent workspace artifact
        if: always() && hashFiles('agent_workspace/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-workspace
          path: agent_workspace/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload answer artifact
        if: always() && hashFiles('latest-result.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ai-answer
          path: latest-result.md
          if-no-files-found: warn
          retention-days: 30

      - name: Show server log if generation failed
        if: failure()
        run: |
          if [ -f .cache/llama-server.log ]; then
            tail -n 200 .cache/llama-server.log
          fi

      - name: Commit conversation without losing concurrent JSON requests
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/conversation.json latest-result.md latest-answer.txt
          if git diff --cached --quiet; then
            echo "No conversation files changed."
            exit 0
          fi
          git commit -m "Save AI conversation result"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch origin main
          git rebase FETCH_HEAD
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" push origin HEAD:main
